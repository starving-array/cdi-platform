spring:
  application:
    name: cdi-backend
  profiles:
    active: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/cdi}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

cdi:
  embedding:
    provider: onnx
    model-path: classpath:models/all-MiniLM-L6-v2/model.onnx
    model-version: all-MiniLM-L6-v2-onnx-v1
  evidence:
    similarity-threshold: 0.65
  github:
    token: ${GITHUB_TOKEN:}
  security:
    jwt:
      issuer-uri: ${CDI_JWT_ISSUER_URI:}
      jwk-set-uri: ${CDI_JWT_JWK_SET_URI:}
      audiences:
        - ${CDI_JWT_AUDIENCE:cdi-platform-api}

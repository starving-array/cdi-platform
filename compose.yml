services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cdi-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cdi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
